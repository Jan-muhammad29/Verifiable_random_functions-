# OPTIONAL: Render deployment with a PERSISTENT disk (typically requires paid hosting).
# An ephemeral/free filesystem loses raffle data during deploys and restarts.
services:
  - type: web
    name: veridraw-json
    runtime: node
    plan: starter
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm run db:init && npm run db:admin && npm start
    healthCheckPath: /api/health
    disk:
      name: veridraw-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: ENABLE_DEMO
        value: 'false'
      - key: DATA_FILE
        value: /var/data/veridraw.json
      - key: HOST
        value: 0.0.0.0
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: VRF_PRIVATE_KEY_HEX
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false

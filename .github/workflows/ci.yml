name: VeriDraw - JSON storage and cryptography
on:
  push:
  pull_request:
jobs:
  build-test:
    runs-on: ubuntu-latest
    env:
      DATA_FILE: ./data/ci-veridraw.json
      VRF_PRIVATE_KEY_HEX: 1111111111111111111111111111111111111111111111111111111111111111
      ADMIN_EMAIL: ci-admin@example.test
      ADMIN_PASSWORD: CI_TestOnly_SecretPassword_NotProduction
      FRONTEND_ORIGIN: http://127.0.0.1:5173
      ENABLE_DEMO: 'true'
      NODE_ENV: test
      PORT: '5000'
      HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run db:init
      - run: npm run db:admin
      - name: Run API smoke tests
        shell: bash
        run: |
          npm start > /tmp/veridraw-api.log 2>&1 &
          node scripts/smoke.mjs || (cat /tmp/veridraw-api.log && exit 1)
